[package]
name = "ito-prefs"
description = "uchmk's settings screen: the nav, the cards of rows and their controls, and the pages every app shares (language, clock, theme, notifications, keys)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `tabs_rows`: the settings rows of `ito-tabs`.
tabs = ["dep:ito-tabs"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui = { version = "0.36", default-features = false }
ito-a11y = { path = "../ito-a11y", features = ["egui"] }
ito-common = { path = "../ito-common" }
ito-i18n = { path = "../ito-i18n" }
ito-keymap = { path = "../ito-keymap" }
ito-keys = { path = "../ito-keys", features = ["egui"] }
ito-notify = { path = "../ito-notify" }
ito-secret = { path = "../ito-secret" }
ito-openin = { path = "../ito-openin" }
ito-tabs = { path = "../ito-tabs", optional = true }
ito-theme = { path = "../ito-theme" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
