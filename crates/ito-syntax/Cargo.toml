[package]
name = "ito-syntax"
description = "Syntax kinds for code: a path and lines of text in, token kinds as byte ranges out (syntect's pure-Rust engine with bat's grammar collection, loaded once per process)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# bat's grammar collection on syntect's pure-Rust regex engine, so nothing
# needs a C compiler (the same pair kura and michi used).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[features]
# Coloured spans for a named syntect theme (`themed`), for an app that paints a
# theme's own colours (kura's `syntect_theme`) instead of mapping `Tok`.
themes = []
