[package]
name = "ito-markdown"
description = "Markdown for a writing box: wrap a selection (bold / italic / underline / strike / link / lists), read blocks and inline marks, write HTML and plain text. No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The egui preview painter and the writing box.
egui = ["dep:egui", "dep:ito-theme"]

[dependencies]
egui = { version = "0.36", optional = true }
ito-theme = { path = "../ito-theme", optional = true }
