[package]
name = "ito-common"
description = "What every uchmk app shares: the config folder, common.toml (language, theme, clock), editing a TOML file in place and watching it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The clock's words for now (`Clock::text`), with chrono; reading the
# settings needs none of it.
clock = ["dep:chrono"]
# `window::Seen::of`: what the window looks like, read off egui's context.
egui = ["dep:egui"]
# `dirwatch::DirWatcher`: events for the directories on screen, with `notify`.
dirwatch = ["dep:notify"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# Writing one key with the file's comments and layout kept; Pure Rust, the
# toml crate's own.
toml_edit = "0.25"
# The releases/latest answer of the update check.
serde_json = "1"
# The OS's language for `auto`: Pure Rust on every OS (Win32, CoreFoundation
# and the environment), no C to build.
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
# The window handed to `window::Window::put` (what eframe's `CreationContext`
# is); Pure Rust, no dependencies.
raw-window-handle = "0.6"
egui = { version = "0.36", optional = true }
notify = { version = "8", default-features = false, features = ["macos_fsevent"], optional = true }

[target."cfg(windows)".dependencies]
# The OS's light or dark from the registry (`OsLight`): winit's lags a switch.
# The screens there are now (`window::screens`), before winit has a window,
# and putting the new window on its pixels (`window::Window::put`).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(unix)".dependencies]
# The effective user and group, for `access::others_can_write`.
libc = "0.2"
