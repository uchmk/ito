[package]
name = "ito-sftp"
description = "Send and fetch files over SFTP with a plain blocking API: pinned host key, password or key file, wildcards, .part then rename, timeouts and a stop flag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `ring` (not the default aws-lc-rs) needs a C compiler on Linux and macOS targets only; Windows MSVC builds as is.
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }

[dev-dependencies]
rand = "0.10"
tempfile = "3"
