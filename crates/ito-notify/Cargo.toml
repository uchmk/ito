[package]
name = "ito-notify"
description = "Telling a person from an app: the system's notification, a sound, and a webhook (ntfy, Slack, Discord or JSON)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `sink`: with `ITO_NOTIFY_SINK=<file>` nothing is shown or played; it is written to the file, and clicks are read
# from `<file>.click`. For tests only; a build without it never reads the variable.
test-sink = []

[dependencies]
png = "0.18"
ito-secret = { path = "../ito-secret" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
