[package]
name = "ito-secret"
description = "Secrets (a webhook address, a password) kept in the OS credential store, never in a file: Windows Credential Manager, macOS Keychain, Linux Secret Service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
