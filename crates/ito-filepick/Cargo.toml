[package]
name = "ito-filepick"
description = "An open-file / choose-folder dialog whose listing comes from the app (a folder on another machine): the model without egui, and the egui window behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# `Picker::show`: the modal window.
egui = ["dep:egui", "dep:chrono", "dep:ito-a11y", "dep:ito-common", "dep:ito-keys", "dep:ito-prefs", "dep:ito-theme"]
# `Serialize` / `Deserialize` for `Entry`, `Kind` and `Listing`, so an engine can send them as JSON.
serde = ["dep:serde"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
egui = { version = "0.36", optional = true }
ito-a11y = { path = "../ito-a11y", features = ["egui"], optional = true }
ito-common = { path = "../ito-common", features = ["clock"], optional = true }
ito-keys = { path = "../ito-keys", features = ["egui"], optional = true }
ito-prefs = { path = "../ito-prefs", optional = true }
ito-theme = { path = "../ito-theme", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "filepick"
required-features = ["egui"]
