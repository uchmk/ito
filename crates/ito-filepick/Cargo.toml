[package]
name = "ito-filepick"
description = "An open-file / choose-folder dialog whose listing comes from the app (a folder on another machine): the model without egui, and the egui window behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# `Picker::show`: the modal window.
egui = ["dep:egui", "dep:chrono", "dep:ito-a11y", "dep:ito-common", "ito-common/clock", "dep:ito-confirm", "dep:ito-keys", "dep:ito-prefs", "dep:ito-theme"]
# `Serialize` / `Deserialize` for `Entry`, `Kind`, `Listing`, `Place`, `PlaceKind` and `Style`, so an engine can send them as JSON.
serde = ["dep:serde"]
# `list_local`, `local_places`, `local_style`: an engine lists its own disk for a picker on another machine.
local = ["dep:ito-common", "dep:windows"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
egui = { version = "0.36", optional = true }
ito-a11y = { path = "../ito-a11y", features = ["egui"], optional = true }
ito-common = { path = "../ito-common", optional = true }
ito-confirm = { path = "../ito-confirm", optional = true }
ito-keys = { path = "../ito-keys", features = ["egui"], optional = true }
ito-prefs = { path = "../ito-prefs", optional = true }
ito-theme = { path = "../ito-theme", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"], optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "filepick"
required-features = ["egui"]
