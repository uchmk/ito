[package]
name = "ito-select"
description = "Picking up painted text with the mouse and copying it: for panes drawn with a painter, not made of widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
egui = { version = "0.36", default-features = false }

[dev-dependencies]
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
