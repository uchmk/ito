[package]
name = "ito-power"
description = "Power and sleep: keep the PC awake while a job runs, wake it for a scheduled time (and say why not), read how soon it sleeps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_NetworkListManager", "Win32_Security", "Win32_System_Com", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
