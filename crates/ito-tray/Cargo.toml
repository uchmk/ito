[package]
name = "ito-tray"
description = "A resident icon in the system tray: its state by colour and a symbol, a tooltip, a right-click menu, clicks delivered on a channel. Windows now; macOS and Linux say Unsupported"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ito-a11y = { path = "../ito-a11y" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
