[package]
name = "ito-openin"
description = "Opening things in other programs from a command-line template: a folder in a terminal or file manager, a file in an editor at a line, two or three files in a diff / merge tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The `[open]` and `[line_args]` tables of an app's config.toml; the same
# versions as ito-common, both Pure Rust.
serde = { version = "1", features = ["derive"] }
toml = "1.1"
