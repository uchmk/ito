[package]
name = "ito-keyscript"
description = "`--keys` scripts (`2<A-S-Right><Wait:300><Shot:cpu>`): parsed, and played into an egui app's input, with screenshots saved as PNG"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
egui = "0.36"
ito-a11y = { path = "../ito-a11y", features = ["egui"] }
ito-clipboard = { path = "../ito-clipboard", default-features = false }
ito-common = { path = "../ito-common" }
ito-i18n = { path = "../ito-i18n" }
ito-keys = { path = "../ito-keys", features = ["egui"] }
ito-theme = { path = "../ito-theme" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
ito-a11y = { path = "../ito-a11y", features = ["egui"] }
