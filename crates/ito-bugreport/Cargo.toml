[package]
name = "ito-bugreport"
description = "A pre-filled bug report: the link to the app's GitHub issue form with the version, OS and what the app knew already filled in, the same lines in every app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
# The Windows name and build, and the machine's own architecture (RtlGetVersion,
# the registry, IsWow64Process2): none of it has an answer in std.
windows = { version = "0.62", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
