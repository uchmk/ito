[package]
name = "ito-sql"
description = "Run a SQL script on SQL Server (Windows or SQL login), PostgreSQL or SQLite with a plain blocking API: changed-row counts, the last result set as CSV, a stop flag and a timeout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["sqlserver", "postgres", "sqlite"]
sqlserver = ["dep:tiberius", "dep:tokio", "dep:tokio-util", "dep:futures-util", "dep:rustls", "dep:chrono"]
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:tokio", "dep:webpki-roots"]
sqlite = ["dep:rusqlite"]

[dependencies]
ito-table = { path = "../ito-table" }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "winauth", "chrono"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
