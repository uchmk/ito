[package]
name = "ito-fileops"
description = "Local file chores without a shell: delete old files, empty a folder, copy a tree like robocopy /E, copy matching files with a SHA-256 check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ito-common = { path = "../ito-common" }
ito-match = { path = "../ito-match" }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
