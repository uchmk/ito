[package]
name = "ito-oauth"
description = "OAuth 2.0 sign-in for a desktop app (browser, loopback redirect, PKCE, refresh token kept in the OS credential store, revoke on sign-out) and a blocking HTTPS client for public hosts (webpki roots)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ito-secret = { path = "../ito-secret" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
sha2 = "0.11"
webpki-roots = "1"
# `ring` (not the default aws-lc-rs) needs a C compiler on Linux and macOS targets only, like ito-mail.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
