# {{app}}'s values for the lanes' shared scripts (scripts/lanes.sh): the
# scripts are the same bytes in every uchmk app and read what differs from
# here. kura's scripts/lanes.conf says what each key is for.
app={{app}}
crate={{app}}
bin={{app}}
keys_env={{env_prefix}}_KEYS_DONE
state={{app}}-wintest
# Optional: the app's environment variable for an absolute scale. With it, an evidence run sets the scale from the check spec's
# window.pixels_per_point (so the run does not depend on the screen) and the manifest records it as scale_override. Without it a scale
# mismatch stays an ERROR. The value includes the OS scale: the app divides it by native_pixels_per_point to get its zoom. A zoom variable
# that the OS scale multiplies does not belong here: it only comes out right on a 100% screen.
#scale_env={{env_prefix}}_PIXELS_PER_POINT
todo_marks=【人】 【金】 【実機】 要確認
# {{app}} takes the ito-first check and its lists, not the test lanes' scripts
# (add the names when the app gets those lanes).
files=lanes.sh ito-first.py ito-first.txt ito-required.txt release-sums.sh
# The workflows written from ito's templates by lanes.sh sync (audit.yml and ci.yml are the app's own).
workflows=build.yml arm64.yml checklists.yml release.yml release-sums.yml
