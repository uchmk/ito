name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE-*']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Nothing here writes to the repository or its issues.
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace --all-features
      - run: cargo test --workspace --all-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ito first: the app uses the ito crates and does not carry its own copy of
  # what they do (scripts/ito-first.py; exceptions in scripts/ito-first.allow).
  ito-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/ito-first.py
      - run: scripts/lanes.sh check
      - run: cargo run -q -p {{app}} --example make-testcheck -- --check
      - run: cargo run -q -p {{app}} --example make-bugform -- --check
