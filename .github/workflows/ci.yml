name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE-*']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Windows is the apps' first platform; Linux is cheap and catches the Unix PTY.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A test that hangs (a pipe held open) fails the job instead of holding
    # the runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace --all-features
      - run: cargo test --workspace --all-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings

  # The lanes' scripts the apps copy (scripts/lanes/FILES): parsed, and
  # merge-lanes.py's self-test run. Nothing of them runs against a repository.
  lanes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: for f in scripts/lanes/*.sh; do bash -n "$f"; done
      - run: python3 scripts/lanes/merge-lanes.py --self-test
      - run: pwsh -NoProfile -File scripts/lanes/check-ps1.ps1

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
